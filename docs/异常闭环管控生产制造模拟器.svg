<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"
     viewBox="0 0 1600 900" role="img"
     aria-labelledby="title desc">
  <title id="title">汽车四工艺异常闭环管控模拟器</title>
  <desc id="desc">
    订单依次经过冲压、焊装、涂装、总装，生产数据驱动订单、物料和设备异常处置，
    处置结果更新生产状态并反馈到工艺执行，完工订单进入仓库。
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071722"/>
      <stop offset="1" stop-color="#06131d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123242"/>
      <stop offset="1" stop-color="#0b202c"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10312b"/>
      <stop offset="1" stop-color="#0a211e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#78b2c2" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <marker id="cyan" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#30d8d2"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5da9ff"/>
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ffb454"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff7387"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#55df9b"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        fill: #dcecf1;
      }
      .title { font-size: 31px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { font-size: 14px; fill: #84aab8; }
      .eyebrow { font-size: 10px; font-weight: 700; fill: #6792a1; letter-spacing: 1.6px; }
      .heading { font-size: 18px; font-weight: 750; }
      .process { font-size: 23px; font-weight: 800; }
      .body { font-size: 12px; fill: #a5bfc8; }
      .small { font-size: 10px; fill: #7c9fac; }
      .tiny { font-size: 9px; fill: #668c9a; }
      .muted { fill: #668c9a; }
      .mono {
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 10px;
      }
      .cyan { fill: #30d8d2; }
      .blue { fill: #70b7ff; }
      .orange { fill: #ffb454; }
      .red { fill: #ff7c8f; }
      .green { fill: #55df9b; }
      .chip {
        fill: #081c27;
        stroke: #78b2c2;
        stroke-opacity: 0.18;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="40" y="28" width="6" height="58" rx="3" fill="#30d8d2"/>
  <text x="61" y="59" class="title">汽车四工艺异常闭环管控模拟器</text>
  <text x="62" y="84" class="subtitle">
    生产流 · 异常感知 · 处置执行 · 状态反馈
  </text>

  <!-- Production flow -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="210" height="150" rx="15"
          fill="url(#card)" stroke="#5da9ff" stroke-opacity="0.38"/>
    <text x="60" y="158" class="eyebrow blue">INPUT</text>
    <text x="60" y="189" class="heading">订单批次</text>
    <rect x="60" y="207" width="168" height="25" rx="7" class="chip"/>
    <text x="144" y="224" text-anchor="middle" class="small">Job · BOM · 交期</text>
    <text x="60" y="253" class="body">初始订单 / 新增订单 / 取消</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="130" width="210" height="150" rx="15"
          fill="url(#card)" stroke="#30d8d2" stroke-opacity="0.4"/>
    <text x="320" y="158" class="eyebrow cyan">PROCESS 1 · FJSP</text>
    <text x="320" y="190" class="process">冲压</text>
    <text x="320" y="218" class="body">Job 工序顺序</text>
    <text x="320" y="240" class="mono cyan">O₁ → O₂ → … → Oₖ</text>
    <text x="320" y="263" class="small">M01–M08 · 物料 M1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="130" width="210" height="150" rx="15"
          fill="url(#card)" stroke="#5da9ff" stroke-opacity="0.4"/>
    <text x="550" y="158" class="eyebrow blue">PROCESS 2 · FJSP</text>
    <text x="550" y="190" class="process">焊装</text>
    <text x="550" y="218" class="body">Job 工序顺序</text>
    <text x="550" y="240" class="mono blue">O₁ → O₂ → … → Oₖ</text>
    <text x="550" y="263" class="small">M09–M14 · 物料 M2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="130" width="210" height="150" rx="15"
          fill="url(#card)" stroke="#c18cff" stroke-opacity="0.42"/>
    <text x="780" y="158" class="eyebrow" style="fill:#c9a0ff">PROCESS 3 · FJSP</text>
    <text x="780" y="190" class="process">涂装</text>
    <text x="780" y="218" class="body">Job 工序顺序</text>
    <text x="780" y="240" class="mono" style="fill:#d7b8ff">O₁ → O₂ → … → Oₖ</text>
    <text x="780" y="263" class="small">M15–M19 · 物料 M3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="130" width="210" height="150" rx="15"
          fill="url(#card)" stroke="#55df9b" stroke-opacity="0.4"/>
    <text x="1010" y="158" class="eyebrow green">PROCESS 4 · FJSP</text>
    <text x="1010" y="190" class="process">总装</text>
    <text x="1010" y="218" class="body">Job 工序顺序</text>
    <text x="1010" y="240" class="mono green">O₁ → O₂ → … → Oₖ</text>
    <text x="1010" y="263" class="small">M20–M26 · 物料 M4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1250" y="130" width="310" height="150" rx="15"
          fill="url(#card)" stroke="#55df9b" stroke-opacity="0.38"/>
    <text x="1270" y="158" class="eyebrow green">OUTPUT</text>
    <text x="1270" y="190" class="heading">成品仓库</text>
    <text x="1270" y="220" class="body">四工艺完工订单统一入仓</text>
    <rect x="1270" y="240" width="270" height="23" rx="7" class="chip"/>
    <text x="1405" y="256" text-anchor="middle" class="small">已完成 · 可交付</text>
  </g>

  <path d="M250 205H292" stroke="#30d8d2" stroke-width="3" marker-end="url(#cyan)"/>
  <path d="M510 205H522" stroke="#5da9ff" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M740 205H752" stroke="#5da9ff" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M970 205H982" stroke="#55df9b" stroke-width="3" marker-end="url(#green)"/>
  <path d="M1200 205H1242" stroke="#55df9b" stroke-width="3" marker-end="url(#green)"/>

  <!-- Live production data bus -->
  <g>
    <rect x="300" y="315" width="900" height="48" rx="12"
          fill="#0a1f2b" stroke="#78b2c2" stroke-opacity="0.2"/>
    <text x="750" y="337" text-anchor="middle" class="small">
      实时生产数据：Job · 工序 · 机器队列 · 物料库存 · 设备状态
    </text>
    <text x="750" y="353" text-anchor="middle" class="tiny mono muted">
      PROCESS DATA BUS
    </text>
  </g>
  <path d="M405 280V307" stroke="#5da9ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blue)"/>
  <path d="M635 280V307" stroke="#5da9ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blue)"/>
  <path d="M865 280V307" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#orange)"/>
  <path d="M1095 280V307" stroke="#ff7387" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>

  <!-- Anomalies -->
  <text x="40" y="401" class="eyebrow red">ANOMALY</text>
  <g filter="url(#shadow)">
    <rect x="40" y="420" width="270" height="105" rx="14"
          fill="#0d2433" stroke="#5da9ff" stroke-opacity="0.34"/>
    <text x="60" y="449" class="heading">订单异常</text>
    <rect x="60" y="466" width="98" height="25" rx="7" class="chip"/>
    <text x="109" y="483" text-anchor="middle" class="small blue">新增订单</text>
    <rect x="168" y="466" width="98" height="25" rx="7" class="chip"/>
    <text x="217" y="483" text-anchor="middle" class="small blue">订单取消</text>
    <text x="60" y="510" class="small">Job / BOM / 交期变化</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="420" width="390" height="105" rx="14"
          fill="#282116" stroke="#ffb454" stroke-opacity="0.38"/>
    <text x="360" y="449" class="heading orange">物料异常</text>
    <text x="360" y="477" class="body">机器可用物料与工序需求</text>
    <rect x="360" y="489" width="112" height="23" rx="7" class="chip"/>
    <text x="416" y="505" text-anchor="middle" class="small">库存校验</text>
    <rect x="480" y="489" width="112" height="23" rx="7" class="chip"/>
    <text x="536" y="505" text-anchor="middle" class="small">补料在途</text>
    <rect x="600" y="489" width="112" height="23" rx="7" class="chip"/>
    <text x="656" y="505" text-anchor="middle" class="small">物料恢复</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="420" width="440" height="105" rx="14"
          fill="#2b1821" stroke="#ff7387" stroke-opacity="0.36"/>
    <text x="780" y="449" class="heading red">设备异常</text>
    <text x="780" y="477" class="body">加工机器异常检测与预测报警</text>
    <rect x="780" y="489" width="94" height="23" rx="7" class="chip"/>
    <text x="827" y="505" text-anchor="middle" class="small red">短故障</text>
    <rect x="884" y="489" width="94" height="23" rx="7" class="chip"/>
    <text x="931" y="505" text-anchor="middle" class="small red">中等故障</text>
    <rect x="988" y="489" width="94" height="23" rx="7" class="chip"/>
    <text x="1035" y="505" text-anchor="middle" class="small red">长故障</text>
    <rect x="1092" y="489" width="88" height="23" rx="7" class="chip"/>
    <text x="1136" y="505" text-anchor="middle" class="small orange">降效</text>
  </g>

  <path d="M175 280V412" stroke="#5da9ff" stroke-width="2.5"
        stroke-dasharray="6 5" marker-end="url(#blue)"/>
  <path d="M750 363V412" stroke="#ffb454" stroke-width="2.5" marker-end="url(#orange)"/>
  <path d="M980 363V412" stroke="#ff7387" stroke-width="2.5" marker-end="url(#red)"/>

  <!-- Unified exception disposition -->
  <g filter="url(#shadow)">
    <rect x="40" y="580" width="1160" height="180" rx="16"
          fill="#1d1d1d" stroke="#ffb454" stroke-opacity="0.34"/>
    <text x="60" y="606" class="eyebrow orange">UNIFIED DISPOSITION</text>
    <text x="60" y="631" class="heading">统一异常处置模块</text>

    <rect x="60" y="646" width="340" height="63" rx="10"
          fill="#0d2433" stroke="#5da9ff" stroke-opacity="0.28"/>
    <text x="78" y="669" class="body strong blue">订单处置</text>
    <text x="78" y="691" class="small">插单重排 · 取消清理 · 计划发布</text>

    <rect x="420" y="646" width="340" height="63" rx="10"
          fill="#282116" stroke="#ffb454" stroke-opacity="0.3"/>
    <text x="438" y="669" class="body strong orange">物料处置</text>
    <text x="438" y="691" class="small">阈值补料 · 到货恢复 · 开工扣料</text>

    <rect x="780" y="646" width="400" height="63" rx="10"
          fill="#2b1821" stroke="#ff7387" stroke-opacity="0.28"/>
    <text x="798" y="669" class="body strong red">设备处置</text>
    <text x="798" y="691" class="small">等待 · 换机 · DRL/HLS 重排 · 降效恢复</text>

    <rect x="60" y="722" width="1120" height="25" rx="7"
          fill="#091e29" stroke="#ffb454" stroke-opacity="0.2"/>
    <text x="620" y="739" text-anchor="middle" class="small orange">
      统一输出：处置动作 + 事件结果 + 状态变更
    </text>
  </g>

  <path d="M175 525V572" stroke="#5da9ff" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M535 525V572" stroke="#ffb454" stroke-width="3" marker-end="url(#orange)"/>
  <path d="M980 525V572" stroke="#ff7387" stroke-width="3" marker-end="url(#red)"/>

  <!-- State engine -->
  <g filter="url(#shadow)">
    <rect x="1250" y="420" width="310" height="330" rx="15"
          fill="url(#state)" stroke="#55df9b" stroke-opacity="0.36"/>
    <text x="1270" y="450" class="eyebrow green">STATE &amp; PLAN</text>
    <text x="1270" y="481" class="heading">状态更新与计划调整</text>
    <rect x="1270" y="502" width="270" height="40" rx="9" class="chip"/>
    <text x="1405" y="527" text-anchor="middle" class="body">事件队列</text>
    <rect x="1270" y="552" width="270" height="40" rx="9" class="chip"/>
    <text x="1405" y="577" text-anchor="middle" class="body">机器待加工队列</text>
    <rect x="1270" y="602" width="270" height="40" rx="9" class="chip"/>
    <text x="1405" y="627" text-anchor="middle" class="body">物料可用量 / 在途量</text>
    <rect x="1270" y="652" width="270" height="40" rx="9" class="chip"/>
    <text x="1405" y="677" text-anchor="middle" class="body">Job / 目标</text>
    <text x="1405" y="715" text-anchor="middle" class="small green">生成新生产计划</text>
    <text x="1405" y="735" text-anchor="middle" class="small green">发布到生产执行</text>
  </g>

  <path d="M1200 735H1242" stroke="#55df9b" stroke-width="3" marker-end="url(#green)"/>
  <path d="M1405 420V365H1095V290" fill="none" stroke="#55df9b"
        stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/>
  <text x="1110" y="354" class="small green">状态反馈</text>

  <!-- Event loop -->
  <path d="M1405 750V825H175V760" fill="none" stroke="#55df9b"
        stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)"/>
  <text x="800" y="845" text-anchor="middle" class="small green">
    事件闭环：感知 → 统一处置 → 状态更新 → 计划调整 → 执行
  </text>

</svg>
