        code: |
          # -*- coding: utf-8 -*-
          import json
          import re

          _FENCE = re.compile(
              r"^\s*```(?:json)?\s*(.*?)\s*```\s*$",
              re.IGNORECASE | re.DOTALL,
          )

          def _decode(value):
              if isinstance(value, dict):
                  return value
              if not isinstance(value, str) or not value.strip():
                  raise ValueError("input must be a non-empty JSON string")
              text = value.lstrip("\ufeff").strip()
              match = _FENCE.match(text)
              if match:
                  text = match.group(1).strip()
              value = json.loads(text)
              if isinstance(value, dict) and set(value) == {"input"}:
                  value = value["input"]
              if not isinstance(value, dict):
                  raise ValueError("input must decode to a JSON object")
              return value

          def _integer(data, key, default):
              value = data.get(key, default)
              if isinstance(value, bool):
                  raise ValueError(f"{key} must be an integer")
              try:
                  return int(value)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"{key} must be an integer") from exc

          def _number(data, key, default):
              value = data.get(key, default)
              if isinstance(value, bool):
                  raise ValueError(f"{key} must be a number")
              try:
                  return float(value)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"{key} must be a number") from exc

          def main(input=None, **kwargs):
              if input is None:
                  for key in ("text", "content", "data", "value"):
                      if kwargs.get(key) is not None:
                          input = kwargs[key]
                          break
              data = _decode(input)

              raw_lines = data.get("raw_lines")
              if not isinstance(raw_lines, str) or not raw_lines.strip():
                  raise ValueError("raw_lines must be a non-empty string")

              additional_lines = data.get("additional_lines", "")
              if additional_lines is None:
                  additional_lines = ""
              if not isinstance(additional_lines, str):
                  raise ValueError("additional_lines must be a string")

              instance_name = str(data.get("instance_name") or "instance")
              seed = _integer(data, "seed", 0)
              total_time = _integer(data, "total_time_seconds", 20)
              search_mode = _number(data, "search_mode", 0.6)
              random_strategy = _number(data, "random_strategy", 0.5)
              max_repeat = _integer(data, "max_repeat_count", 1000)
              max_iter = _integer(data, "max_iter_count", 45)
              population = _integer(data, "population_size", 32)
              tabu_length = _integer(data, "tabu_length", 30)

              if not 1 <= total_time <= 300:
                  raise ValueError("total_time_seconds must be between 1 and 300")
              if not 0.0 <= search_mode <= 1.0:
                  raise ValueError("search_mode must be between 0 and 1")
              if not 0.0 <= random_strategy <= 1.0:
                  raise ValueError("random_strategy must be between 0 and 1")
              if max_repeat <= 0 or max_iter <= 0 or tabu_length <= 0:
                  raise ValueError("search counts and tabu_length must be positive")
              if population < 2:
                  raise ValueError("population_size must be at least 2")

              result = {
                  "raw_lines": raw_lines,
                  "additional_lines": additional_lines,
                  "instance_name": instance_name,
                  "seed": seed,
                  "total_time_seconds": total_time,
                  "search_mode": search_mode,
                  "random_strategy": random_strategy,
                  "max_repeat_count": max_repeat,
                  "max_iter_count": max_iter,
                  "population_size": population,
                  "tabu_length": tabu_length,
              }
              return {**result, "output": result}
