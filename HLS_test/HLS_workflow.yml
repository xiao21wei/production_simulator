      nodeParam:
        code: |
          # -*- coding: utf-8 -*-
          import json

          def main(input=None, **kwargs):
              if input is None:
                  for key in ("output", "data", "result"):
                      if kwargs.get(key) is not None:
                          input = kwargs[key]
                          break
              if isinstance(input, str):
                  input = json.loads(input)
              if not isinstance(input, dict):
                  raise ValueError("model output must be a JSON object")

              result = dict(input)
              schedule = result.get("schedule")
              if not isinstance(schedule, list):
                  raise ValueError("model output must contain a schedule array")

              rows_by_machine = {}
              for row in schedule:
                  if not isinstance(row, dict):
                      raise ValueError("each schedule item must be an object")
                  machine_id = int(row["machine_id"])
                  rows_by_machine.setdefault(machine_id, []).append(row)

              declared_machines = int(result.get("n_machines") or 0)
              machine_count = max(
                  declared_machines,
                  max(rows_by_machine, default=-1) + 1,
              )

              machine_sequences = []
              for machine_id in range(machine_count):
                  ordered_rows = sorted(
                      rows_by_machine.get(machine_id, []),
                      key=lambda row: (
                          float(row["start_time"]),
                          float(row["end_time"]),
                          int(row["job_id"]),
                          int(row["operation_index"]),
                      ),
                  )
                  machine_sequences.append(
                      [
                          [
                              int(row["job_id"]),
                              int(row["operation_index"]),
                          ]
                          for row in ordered_rows
                      ]
                  )

              result["schedule"] = machine_sequences
              return {"output": result}
        appId: 680ab54f
        uid: e7c82078-4c8f-4f18-a845-1d299e60bf47
        codeErrMsg: ''
        setAnswerContentErrMsg: ''
