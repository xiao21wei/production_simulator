        code: |
          # -*- coding: utf-8 -*-
          import json
          import urllib.error
          import urllib.request

          MODEL_ENDPOINT = "http://127.0.0.1:39004/schedule"
          MODEL_INPUT_FIELDS = (
              "raw_lines",
              "additional_lines",
              "instance_name",
              "seed",
              "total_time_seconds",
              "search_mode",
              "random_strategy",
              "max_repeat_count",
              "max_iter_count",
              "population_size",
              "tabu_length",
          )

          def _request(payload):
              request = urllib.request.Request(
                  MODEL_ENDPOINT,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=140) as response:
                  return json.loads(response.read().decode("utf-8"))

          def main(input=None, **kwargs):
              if input is None:
                  for key in ("output", "data", "result"):
                      if kwargs.get(key) is not None:
                          input = kwargs[key]
                          break
              if isinstance(input, str):
                  input = json.loads(input)
              if not isinstance(input, dict):
                  raise ValueError("input must decode to a model input object")

              payload = {
                  key: input[key]
                  for key in MODEL_INPUT_FIELDS
                  if key in input
              }
              try:
                  result = _request(payload)
              except urllib.error.HTTPError as first_error:
                  detail = first_error.read().decode("utf-8", errors="replace")
                  expects_wrapper = (
                      first_error.code == 400
                      and '"loc":["request"]' in detail.replace(" ", "")
                  )
                  if not expects_wrapper:
                      raise RuntimeError(
                          f"local model returned HTTP {first_error.code}: {detail}"
                      ) from first_error
                  try:
                      result = _request({"request": payload})
                  except urllib.error.HTTPError as second_error:
                      second_detail = second_error.read().decode(
                          "utf-8",
                          errors="replace",
                      )
                      raise RuntimeError(
                          f"local model returned HTTP {second_error.code}: "
                          f"{second_detail}"
                      ) from second_error
              return {"output": result}
        appId: 680ab54f
        uid: e7c82078-4c8f-4f18-a845-1d299e60bf47
